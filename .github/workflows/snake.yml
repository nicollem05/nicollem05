name: Generate snake animation
 
on:
  # runs automatically every day
  schedule:
    - cron: "0 0 * * *"
  # lets you run it manually from the Actions tab
  workflow_dispatch:
  # runs every time you push to main
  push:
    branches:
      - main
 
jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
 
    steps:
      - name: Generate red snake SVGs
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-red-dark.svg?palette=github-dark&color_snake=#ffebee&color_dots=#161b22,#5c0a0a,#8e1414,#c62828,#ff5252
            dist/snake-red-light.svg?palette=github-light&color_snake=#b71c1c&color_dots=#ebedf0,#ffcdd2,#ef9a9a,#e53935,#b71c1c
 
      - name: Push SVGs to the output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
 
